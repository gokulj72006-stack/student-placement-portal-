# ========================================================
# Student Course & Placement Portal - Backend Config
# ========================================================

server.port=8080
spring.application.name=student-placement-portal

# --------------------------------------------------------
# 1. Primary Database Configuration: MySQL
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/student_placement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------
# 2. H2 Fallback (Uncomment below and comment MySQL to run
#    with zero-install embedded database)
# --------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:student_portal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Jackson Formatter for clean JSON DateTimes
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.portal=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
